version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bharat_law_backend
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - BHARAT_LAW_VERBOSE=1
    ports:
      - "8000:8000"
    volumes:
      - ./db:/app/db
      - ./legal_docs:/app/legal_docs
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bharat_law_frontend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: always
